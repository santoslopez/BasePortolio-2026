<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Links — Tu Nombre</title>

    <meta
        name="description"
        content="Todos los enlaces de Tu Nombre."
    >

    <meta name="theme-color" content="#fafafa">


    <style>

        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --background: #fafafa;
            --surface: #ffffff;

            --text: #171717;
            --muted: #737373;
            --subtle: #a3a3a3;

            --border: #e5e5e5;
            --hover: #f3f3f3;

            --max-width: 560px;
        }

        [data-theme="dark"] {
            --background: #0c0c0c;
            --surface: #151515;

            --text: #f5f5f5;
            --muted: #a3a3a3;
            --subtle: #737373;

            --border: #292929;
            --hover: #1c1c1c;
        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: var(--background);
            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            transition:
                background .3s ease,
                color .3s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width:
                min(
                    calc(100% - 40px),
                    var(--max-width)
                );

            margin: 0 auto;

            padding:
                32px 0 55px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 85px;
        }

        .back {
            color: var(--muted);

            font-size: 13px;

            transition:
                color .2s ease,
                transform .2s ease;
        }

        .back:hover {
            color: var(--text);

            transform:
                translateX(-3px);
        }


        /* =========================================================
           THEME
        ========================================================= */

        .theme-toggle {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 34px;
            height: 34px;

            padding: 0;

            border:
                1px solid var(--border);

            border-radius: 50%;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .theme-toggle:hover {
            background: var(--hover);

            color: var(--text);

            transform:
                rotate(10deg);
        }

        .theme-toggle svg {
            width: 15px;
            height: 15px;
        }


        /* =========================================================
           INTRO
        ========================================================= */

        .intro {
            text-align: center;
        }

        .profile {
            width: 86px;
            height: 86px;

            object-fit: cover;

            border-radius: 50%;

            border:
                1px solid var(--border);

            background: var(--hover);
        }

        .title {
            margin:
                24px 0 0;

            font-size: 32px;

            line-height: 1.05;

            letter-spacing: -.05em;

            font-weight: 650;
        }

        .subtitle {
            margin:
                10px 0 0;

            color: var(--muted);

            font-size: 13px;
        }


        /* =========================================================
           LINKS
        ========================================================= */

        .links {
            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-top: 42px;
        }

        .link {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding:
                17px 18px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: var(--surface);

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }

        .link:hover {
            background: var(--hover);

            border-color:
                var(--subtle);

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, .035);
        }

        .link-content {
            min-width: 0;
        }

        .link-name {
            font-size: 14px;

            font-weight: 550;
        }

        .link-description {
            margin-top: 3px;

            color: var(--muted);

            font-size: 12px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .arrow {
            flex-shrink: 0;

            color: var(--subtle);

            font-size: 18px;

            transition:
                color .2s ease,
                transform .2s ease;
        }

        .link:hover .arrow {
            color: var(--text);

            transform:
                translate(3px, -3px);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            margin-top: 55px;

            text-align: center;

            color: var(--subtle);

            font-size: 11px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .page {
                width:
                    calc(100% - 32px);

                padding-top: 22px;
            }

            header {
                margin-bottom: 70px;
            }

            .profile {
                width: 80px;
                height: 80px;
            }

            .title {
                font-size: 29px;
            }

            .subtitle {
                font-size: 12px;
            }

            .links {
                margin-top: 36px;
            }

            .link {
                padding:
                    16px 15px;
            }

            .link-name {
                font-size: 13px;
            }

            .link-description {
                font-size: 11px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
            }
        }

    </style>

</head>


<body>

<div class="page">


    <!-- HEADER -->

    <header>

        <a
            href="index.html"
            class="back"
        >
            ← Back
        </a>


        <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Cambiar tema"
        >

            <svg
                id="moonIcon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
            >
                <path
                    d="M21 12.79A9 9 0 1 1 11.21 3
                    7 7 0 0 0 21 12.79z"
                />
            </svg>


            <svg
                id="sunIcon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                style="display:none;"
            >
                <circle
                    cx="12"
                    cy="12"
                    r="4"
                />

                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
            </svg>

        </button>

    </header>


    <!-- MAIN -->

    <main>


        <section class="intro">

            <img
                class="profile"
                src="profile.jpg"
                alt="Foto de Tu Nombre"
            >


            <h1 class="title">
                All my links
            </h1>


            <p class="subtitle">
                Encuéntrame alrededor de la web.
            </p>

        </section>


        <!-- LINKS -->

        <section class="links">


            <!-- GITHUB -->

            <a
                class="link"
                href="https://github.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="link-content">

                    <div class="link-name">
                        GitHub
                    </div>

                    <div class="link-description">
                        Código, proyectos y experimentos
                    </div>

                </div>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- LINKEDIN -->

            <a
                class="link"
                href="https://www.linkedin.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="link-content">

                    <div class="link-name">
                        LinkedIn
                    </div>

                    <div class="link-description">
                        Perfil profesional
                    </div>

                </div>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- INSTAGRAM -->

            <a
                class="link"
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="link-content">

                    <div class="link-name">
                        Instagram
                    </div>

                    <div class="link-description">
                        Fotos y vida cotidiana
                    </div>

                </div>

                <span class="arrow">
                    ↗
                </span>

            </a>


            <!-- EMAIL -->

            <a
                class="link"
                href="mailto:tu@email.com"
            >

                <div class="link-content">

                    <div class="link-name">
                        Email
                    </div>

                    <div class="link-description">
                        Escríbeme directamente
                    </div>

                </div>

                <span class="arrow">
                    ↗
                </span>

            </a>


        </section>

    </main>


    <footer>

        © 2026 Tu Nombre

    </footer>

</div>


<!-- THEME -->

<script>

    const themeToggle =
        document.getElementById("themeToggle");

    const moonIcon =
        document.getElementById("moonIcon");

    const sunIcon =
        document.getElementById("sunIcon");


    const savedTheme =
        localStorage.getItem("theme");

    const systemDark =
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches;


    let theme =
        savedTheme ||
        (systemDark ? "dark" : "light");


    function applyTheme(currentTheme) {

        document.documentElement
            .setAttribute(
                "data-theme",
                currentTheme
            );

        localStorage.setItem(
            "theme",
            currentTheme
        );


        if (currentTheme === "dark") {

            moonIcon.style.display = "none";
            sunIcon.style.display = "block";

        } else {

            moonIcon.style.display = "block";
            sunIcon.style.display = "none";

        }
    }


    applyTheme(theme);


    themeToggle.addEventListener(
        "click",
        () => {

            theme =
                theme === "dark"
                    ? "light"
                    : "dark";

            applyTheme(theme);

        }
    );

</script>

</body>
</html>
