<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 · Página no encontrada</title>

    <meta
        name="description"
        content="La página que buscas no existe."
    >

    <meta name="author" content="Santos López">

    <meta name="theme-color" content="#fafafa">


    <style>

        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {

            --background: #fafafa;
            --surface: #ffffff;

            --text: #171717;
            --muted: #737373;
            --subtle: #a3a3a3;

            --border: #e5e5e5;
            --hover: #f3f3f3;

            --max-width: 760px;
        }


        [data-theme="dark"] {

            --background: #0c0c0c;
            --surface: #151515;

            --text: #f5f5f5;
            --muted: #a3a3a3;
            --subtle: #737373;

            --border: #292929;
            --hover: #1c1c1c;
        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: var(--background);
            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            line-height: 1.6;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;

            transition:
                background-color .3s ease,
                color .3s ease;
        }


        a {

            color: inherit;

            text-decoration: none;
        }


        button {
            font: inherit;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {

            width: min(
                calc(100% - 48px),
                var(--max-width)
            );

            min-height: 100vh;

            margin: 0 auto;

            padding:
                32px 0 50px;

            display: flex;

            flex-direction: column;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 105px;
        }


        .brand {

            font-size: 15px;

            font-weight: 600;

            letter-spacing: -.02em;
        }


        nav {

            display: flex;

            align-items: center;

            gap: 24px;
        }


        nav a {

            color: var(--muted);

            font-size: 13px;

            font-weight: 500;

            transition:
                color .2s ease;
        }


        nav a:hover {

            color: var(--text);
        }


        /* =========================================================
           THEME
        ========================================================= */

        .theme-toggle {

            display: flex;

            align-items: center;
            justify-content: center;

            width: 34px;
            height: 34px;

            padding: 0;

            border:
                1px solid var(--border);

            border-radius: 50%;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }


        .theme-toggle:hover {

            background: var(--hover);

            color: var(--text);

            transform:
                rotate(10deg);
        }


        .theme-toggle svg {

            width: 15px;
            height: 15px;
        }


        /* =========================================================
           404
        ========================================================= */

        .error {

            flex: 1;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding-bottom: 80px;
        }


        .error-number {

            margin: 0;

            color: var(--text);

            font-size:
                clamp(80px, 18vw, 150px);

            line-height: .9;

            letter-spacing: -.08em;

            font-weight: 700;
        }


        .error-title {

            margin: 28px 0 0;

            font-size:
                clamp(26px, 5vw, 38px);

            line-height: 1.1;

            letter-spacing: -.04em;
        }


        .error-description {

            max-width: 520px;

            margin: 18px 0 0;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .home-link {

            display: inline-flex;

            align-items: center;

            width: fit-content;

            margin-top: 30px;

            padding:
                10px 16px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background: var(--surface);

            color: var(--text);

            font-size: 13px;

            font-weight: 500;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease;
        }


        .home-link:hover {

            background: var(--hover);

            border-color:
                var(--subtle);

            transform:
                translateY(-2px);
        }


        .home-arrow {

            margin-left: 8px;

            color: var(--subtle);

            transition:
                transform .2s ease;
        }


        .home-link:hover .home-arrow {

            transform:
                translateX(-3px);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding-top: 20px;

            color: var(--subtle);

            font-size: 12px;
        }


        footer a:hover {

            color: var(--text);
        }


        /* =========================================================
           ANIMATION
        ========================================================= */

        .animate {

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                fadeIn .7s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        .delay-1 {
            animation-delay: .05s;
        }


        .delay-2 {
            animation-delay: .12s;
        }


        .delay-3 {
            animation-delay: .19s;
        }


        @keyframes fadeIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .page {

                width:
                    calc(100% - 36px);

                padding-top: 22px;
            }


            header {

                margin-bottom: 70px;
            }


            nav {

                gap: 13px;
            }


            nav a {

                font-size: 11px;
            }


            .theme-toggle {

                width: 30px;
                height: 30px;
            }


            .error {

                justify-content: center;

                padding-bottom: 50px;
            }


            .error-number {

                font-size: 100px;
            }


            .error-title {

                font-size: 28px;
            }


            .error-description {

                font-size: 14px;

                line-height: 1.75;
            }


            .home-link {

                margin-top: 25px;
            }


            footer {

                align-items: flex-start;

                gap: 10px;

                flex-direction: column;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }


            *,
            *::before {

                animation-duration: .01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: .01ms !important;
            }
        }

    </style>

</head>


<body>

<div class="page">


    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="animate delay-1">

        <a
            href="index.html"
            class="brand"
        >
            SANTOS LÓPEZ
        </a>


        <nav>

            <a href="index.html">
                Inicio
            </a>


            <button
                class="theme-toggle"
                id="themeToggle"
                aria-label="Cambiar tema"
                title="Cambiar tema"
            >

                <!-- MOON -->

                <svg
                    id="moonIcon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                >

                    <path
                        d="M21 12.79A9 9 0 1 1 11.21 3
                        7 7 0 0 0 21 12.79z"
                    />

                </svg>


                <!-- SUN -->

                <svg
                    id="sunIcon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    style="display:none;"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    />

                    <path d="M12 2v2"/>
                    <path d="M12 20v2"/>
                    <path d="M2 12h2"/>
                    <path d="M20 12h2"/>

                </svg>

            </button>

        </nav>

    </header>


    <!-- =========================================================
         ERROR
    ========================================================== -->

    <main class="error">

        <div>

            <div class="error-number animate delay-1">
                404
            </div>


            <h1 class="error-title animate delay-2">
                Página no encontrada
            </h1>


            <p class="error-description animate delay-2">
                Parece que la página que buscas no existe,
                fue movida o la dirección que escribiste
                no es correcta.
            </p>


            <a
                href="index.html"
                class="home-link animate delay-3"
            >

                ← Regresar a inicio

            </a>

        </div>

    </main>


    <!-- =========================================================
         FOOTER
    ========================================================== -->

    <footer>

        <span>
            © 2026 Santos López
        </span>


        <a href="mailto:santos.lopez@galileo.edu">
            santos.lopez@galileo.edu
        </a>

    </footer>

</div>


<!-- =========================================================
     THEME JAVASCRIPT
========================================================== -->

<script>

    const themeToggle =
        document.getElementById("themeToggle");


    const moonIcon =
        document.getElementById("moonIcon");


    const sunIcon =
        document.getElementById("sunIcon");


    const savedTheme =
        localStorage.getItem("theme");


    const systemDark =
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches;


    let theme =
        savedTheme ||
        (systemDark ? "dark" : "light");


    function applyTheme(currentTheme) {

        document.documentElement
            .setAttribute(
                "data-theme",
                currentTheme
            );


        localStorage.setItem(
            "theme",
            currentTheme
        );


        if (currentTheme === "dark") {

            moonIcon.style.display = "none";

            sunIcon.style.display = "block";

        } else {

            moonIcon.style.display = "block";

            sunIcon.style.display = "none";
        }
    }


    applyTheme(theme);


    themeToggle.addEventListener(
        "click",
        () => {

            theme =
                theme === "dark"
                    ? "light"
                    : "dark";


            applyTheme(theme);

        }
    );

</script>

</body>

</html>
